- title: Instances of Cognition
  url: https://www.crumplab.com/cognition/textbook/index.html
  image: images/2530_image.jpg
  description: This is a free, open-educational textbook and set of course materials for an introductory undergraduate course in cognition. The materials have been in continuous development since Fall 2021. All of the materials are CC BY-SA 4.0 creative-commons licensed and free for others to use, copy, remix, re-use.
  built: Written in RStudio with Quarto.
  source: https://github.com/CrumpLab/cognition
  license: CC BY-SA 4.0
  license_url: https://creativecommons.org/licenses/by-sa/4.0/
  citation: 'Crump, M. J. C. (2022, April 21). Instances of Cognition: Questions, Methods, Findings, Explanations, Applications, and Implications.'
- title: 'Reproducible statistics for psychologists with R: Lab Tutorials'
  url: https://crumplab.github.io/rstatsforpsych/
  image: images/RstatsCover.png
  description: This is a series of labs/tutorials for a two-semester graduate-level statistics sequence in Psychology @ Brooklyn College of CUNY. The first set of 13 labs roughly tracks "Thinking with Data" (Vokey & Allen, 2018) and "Answering questions with data" (Crump et al., 2018); the second set of labs (to be written on a weekly basis during the Spring 2021 semester) roughly tracks "Experimental Design and Analysis for Psychology" (Abdi et al., 2009).
  built: Written in Rmarkdown, and compiled with the bookdown package.
  source: https://github.com/CrumpLab/rstatsforpsych
  license: CC BY-SA 4.0
  license_url: https://creativecommons.org/licenses/by-sa/4.0/
  citation: 'Crump, M. J. C. (2020, December 10). Reproducible statistics for psychologists with R: Lab Tutorials. https://doi.org/10.17605/OSF.IO/KBHGA'
- title: 'Using R for Reproducible Research: Student contributed tutorials'
  url: https://crumplab.github.io/psyc7709_2019/book/docs/index.html
  image: images/ReproStudentBook.png
  description: 'These chapters were written by students in <a href="https://crumplab.github.io/psyc7709_2019/">PSYC 7709: Using R for Reproducible research</a>, Spring 2019 @ Brooklyn College of CUNY, as a part of their final project to write a tutorial about an R package.'
  built: Written in Rmarkdown, and compiled with the bookdown package.
  source: https://github.com/CrumpLab/psyc7709_2019
  license: CC BY-SA 4.0
  license_url: https://creativecommons.org/licenses/by-sa/4.0/
  citation: 'Abdelrahman, K., Contreras, A., Degtyarev, Z., Deng, J., Foster, J., Franz, A., Funderburk, T., Horger, M., Kravitz, J., Lakshin A., Manigat, M., Trois, R., Vasquez, A., Vo, A., Wilson, N., and Yeremenko, M. (2019). <em>Using R for Reproducible Research: Student Contributed Tutorials.</em> (M. J. C. Crump, Ed.).'
- title: 'Answering Questions with Data: Introductory Statistics for Psychology Students'
  url: https://crumplab.github.io/statistics/
  image: images/TextbookCover.png
  description: This is a free introductory statistics textbook for undergraduates in Psychology. It is being developed as an Open Educational Resource @ Brooklyn College. It is pitched at the concepts behind statistics, and often uses simulation in R to convey foundational ideas. The writing style is sometimes a bit unconventional, and informal. It is for students who don't want to like statistics.
  built: Written in Rmarkdown, and compiled with the bookdown package.
  source: https://github.com/CrumpLab/statistics
  license: CC BY-SA 4.0
  license_url: https://creativecommons.org/licenses/by-sa/4.0/
  citation: 'Crump, M. J. C., Navarro, D., & Suzuki, J. (2019, June 5). Answering Questions with Data (Textbook): Introductory Statistics for Psychology Students. https://doi.org/10.17605/OSF.IO/JZE52'
  credits:
  - role: Authors
    names: 'Matthew Crump; Chapters 2 and 4 adapted from Navarro, D.; Videos: Jeffrey Suzuki'
- title: 'Answering Questions with Data: The Lab Manual'
  url: https://crumplab.github.io/statisticsLab/
  image: images/LabmanualCover.png
  tagline: Lab activities using R, Excel, SPSS, and JAMOVI
  description: This is the companion lab manual to our free stats book. It contains lab activities for learning how to conduct statistical tests in R, Excel, SPSS, and JAMOVI. We use open data, often from psychology papers, and show step-by-step how to solve data-analysis problems in each software package.
  built: Written in Rmarkdown, and compiled with the bookdown package.
  source: https://github.com/CrumpLab/statisticsLab
  license: CC BY-SA 4.0
  license_url: https://creativecommons.org/licenses/by-sa/4.0/
  citation: 'Crump, M. J. C., Krishnan, A., Volz, S., & Chavarga, A. (2019, June 5). Answering Questions with Data: The Lab Manual for R, Excel, SPSS and Jamovi. https://doi.org/10.17605/OSF.IO/M2NPJ'
  credits:
  - role: Authors
    names: Matthew Crump (R); Stephen Volz (Excel); Alla Chavarga (SPSS); Anjali Krishnan (JAMOVI)
  notes:
  - Some of the labs are adapated from <a href="https://sites.trinity.edu/osl">Open Stats Lab</a>, another great resource.
