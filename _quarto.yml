project:
  type: website
  output-dir: docs/
  resources:
    - /publications
    # CNAME keeps the crumplab.com custom domain on GitHub Pages. The blog's
    # placeholder thumbnail isn't copied automatically.
    - CNAME
    - images/crumplab.png

website:
  title: "crumplab"
  google-analytics: G-HPGGT4QZ8Q
  site-url: "https://crumplab.com"
  description: "Website for the computational cognition lab at Brooklyn College of CUNY."
  twitter-card: true
  open-graph: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - People.qmd
      - href: Publications.qmd
        text: Pubs
      - Books.qmd
      - Courses.qmd
      - Apps.qmd
      - Opportunities.qmd
      - Blog.qmd
      - Fun.qmd
    right:
      - icon: github
        href: https://github.com/CrumpLab
        aria-label: GitHub
      - icon: youtube
        href: https://www.youtube.com/c/CrumpsComputationalCognitionLab
        aria-label: YouTube
      - icon: rss
        href: Blog.xml
        aria-label: Blog RSS feed

# Re-run R code only when a page's source changes. Results are stored in
# _freeze/, which is committed so a full render doesn't re-execute old posts.
execute:
  freeze: auto

format:
  html:
    theme: [cosmo, _assets/theme.scss]
    toc: true
    # Pages that set `banner:` in their front matter show that image in place
    # of the title block (see _assets/title-block.html).
    template-partials:
      - _assets/title-block.html

editor: visual
